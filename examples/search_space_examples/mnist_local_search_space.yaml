input: [1, 28, 28]
output: 10

sequence:
  - block: "1"
    op_candidates: "conv-act-pool"
    type_repeat:
      type: "repeat_params"
      depth: [1, 2, 3]
  - block: "2"
    op_candidates: "linear"

default_op_params:
  conv2d:
    kernel_size: [3, 4]
    stride: [1, 2]
    out_channels: [8, 32]
    padding: ["same"]
  batch_norm:
  activation:
    op: ["relu", "leaky_relu"]
  maxpool:
    kernel_size: [2, 3]
    stride: [1, 2]

composites:
  conv-act-pool:
    sequence:
      - block: "conv_act_pool_1"
        op_candidates: "conv2d"
      - block: "conv_act_pool_2"
        op_candidates: "batch_norm"
      - block: "conv_act_pool_3"
        op_candidates: "activation"
      - block: "conv_act_pool_4"
        op_candidates: "maxpool"
